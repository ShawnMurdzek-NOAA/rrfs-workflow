ioda to obsq converter:
  observation variables:
    - name: airTemperature
      type: AIRCRAFT_TEMPERATURE
    - name: specificHumidity
      type: AIRCRAFT_SPECIFIC_HUMIDITY
    - name: windEastward
      type: AIRCRAFT_U_WIND_COMPONENT
    - name: windNorthward
      type: AIRCRAFT_V_WIND_COMPONENT

  observation category:
    name: conventional
    vertical coordinate:
      name: MetaData/pressure
      units: "pressure (Pa)"
